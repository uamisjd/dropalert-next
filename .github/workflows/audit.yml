name: Verifica dati reali (manuale)

# Solo lancio manuale: non c'è alcun trigger automatico. Serve perché gli script
# `audit:*` sono le uniche letture che hanno senso contro i dati veri, e in locale
# (o in una sandbox) non c'è Postgres da raggiungere. I log sono pubblicati sul
# repository: qui escono CONTAGGI e percentuali, mai righe di gioco o dati personali.
#
#   gh workflow run "Verifica dati reali (manuale)" --ref <branch> -f which=both

on:
  workflow_dispatch:
    inputs:
      which:
        description: "Quale verifica"
        type: choice
        default: "both"
        options:
          - value
          - finished
          - both
          - smoke-odds
          - smoke-wire
          - control
          - migration-rehearsal
          - migration-apply-production
      migration_confirmation:
        description: "Solo migration-apply-production: scrivere APPLICA-0010-PRODUCTION"
        required: false
        default: ""
      migration_snapshot:
        description: "Solo migration-apply-production: snapshot verificato 2026-09-12T21:57:06Z"
        required: false
        default: ""
      match_id:
        description: "Solo per smoke-odds: id partita. Vuoto = ricerca partita (0 crediti)"
        required: false
        default: ""
      ore:
        description: "Solo per smoke-odds senza match_id: finestra di ricerca in ore (72 = tutto l'archivio)"
        required: false
        default: "72"
      sport_key:
        description: "smoke-odds: chiave per lega FUORI mappa (es. soccer_spl). control: limita il ripiego dalla fonte a una chiave coperta (es. soccer_italy_serie_a). Vuoto = automatico"
        required: false
        default: ""

concurrency:
  group: dropalert-audit
  cancel-in-progress: false

jobs:
  audit:
    if: inputs.which != 'migration-rehearsal' && inputs.which != 'migration-apply-production'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash

    env:
      INPUT_WHICH: ${{ inputs.which }}
      INPUT_MATCH_ID: ${{ inputs.match_id }}
      INPUT_HOURS: ${{ inputs.ore }}
      INPUT_SPORT_KEY: ${{ inputs.sport_key }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Accettata con qualunque grafia già in uso: se la chiave sta su Vercel
      # come `theoddsapiKey` basta ricrearla qui con lo stesso nome. Il valore
      # non viene mai stampato.
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY || secrets.ODDS_API_KEY || secrets.theoddsapiKey || secrets.THEODDSAPIKEY }}

    steps:
      - name: Codice
        uses: actions/checkout@v4

      - name: Valida input manuali
        run: bash scripts/validate-workflow-inputs.sh audit

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dipendenze
        run: npm ci --include=dev

      - name: Verifica configurazione database
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL non configurato fra i secrets del repository."
            exit 1
          fi

      # Gli script non stampano la connection string, ma se il client fallisce
      # l'errore di `postgres` la include nell'message: si maschera in uscita.
      - name: Sguardo sui dati (read-only)
        if: inputs.which == 'value' || inputs.which == 'finished' || inputs.which == 'both'
        run: |
          status=0
          run_one() {
            echo "===== $1 ====="
            set +e
            npm run "$1" 2>&1 \
              | sed -E 's#(postgres(ql)?://)[^[:space:]"'"'"']*#\1<redacted>#g'
            local code=$?
            set -e
            if [ "$code" -ne 0 ]; then
              echo "::warning::$1 è uscito con codice $code"
              status=1
            fi
          }
          case "$INPUT_WHICH" in
            value) run_one audit:value-bets ;;
            finished) run_one audit:finished ;;
            *) run_one audit:value-bets; run_one audit:finished ;;
          esac
          exit $status

      # Smoke test di The Odds API. Sta in questa workflow perché condivide
      # l'unica cosa che serve davvero: il database reale raggiungibile da qui.
      # Senza match_id cerca la partita (endpoint fuori quota, 0 crediti);
      # con match_id esegue la lettura vera (1 credito). Vedi
      # docs/SMOKE-THE-ODDS-API.md.
      - name: Smoke The Odds API
        if: inputs.which == 'smoke-odds'
        run: |
          echo "MARKER-SMOKE-ODDS-BRANCH-v1"
          if [ -z "$THE_ODDS_API_KEY" ]; then
            echo "::error::Chiave The Odds API assente fra i secrets (THE_ODDS_API_KEY / ODDS_API_KEY / theoddsapiKey)."
            exit 1
          fi
          MASK='s#(postgres(ql)?://)[^[:space:]"'"'"']*#\1<redacted>#g'
          if [ -n "$INPUT_MATCH_ID" ]; then
            args=()
            if [ -n "$INPUT_SPORT_KEY" ]; then args+=(--sport-key "$INPUT_SPORT_KEY"); fi
            npm run smoke:odds-api -- --match-id "$INPUT_MATCH_ID" "${args[@]}" 2>&1 | sed -E "$MASK"
          elif [ -n "$INPUT_SPORT_KEY" ]; then
            # Sonda gratuita: trova l'id giusto per una lega fuori mappa.
            npm run odds:find -- --sonda "$INPUT_SPORT_KEY" 2>&1 | sed -E "$MASK"
          else
            npm run odds:find -- --ore "$INPUT_HOURS" 2>&1 | sed -E "$MASK"
          fi
      # Smoke test del cablaggio per-bookmaker (fase «1b» del ciclo): elenco
      # candidati (0 crediti) e lettura reale (1 credito) con la stessa
      # persistenza del ciclo. Vedi docs/REGOLE-OPERATIVE-ODDS.md.
      - name: Smoke cablaggio per-bookmaker
        if: inputs.which == 'smoke-wire'
        run: |
          echo "MARKER-SMOKE-WIRE-BRANCH-v1"
          if [ -z "$THE_ODDS_API_KEY" ]; then
            echo "::error::Chiave The Odds API assente fra i secrets (THE_ODDS_API_KEY / ODDS_API_KEY / theoddsapiKey)."
            exit 1
          fi
          MASK='s#(postgres(ql)?://)[^[:space:]"'"'"']*#\1<redacted>#g'
          if [ -n "$INPUT_MATCH_ID" ]; then
            npm run smoke:odds-wire -- --read "$INPUT_MATCH_ID" 2>&1 | sed -E "$MASK"
          else
            npm run smoke:odds-wire 2>&1 | sed -E "$MASK"
          fi

      # Lettura di controllo sul PERCORSO DI PRODUZIONE (getSharpLine) per un
      # campionato coperto: budget → mappa → decisione → lettura reale →
      # contatori in system_state. Se l'archivio ha il turno, legge da lì;
      # altrimenti il ripiego sceglie la partita dall'endpoint GRATUITO
      # /events sulle chiavi coperte (1 credito la lettura). Con
      # --solo-archivio non spende nulla. Vedi docs/SMOKE-THE-ODDS-API.md.
      - name: Lettura di controllo (produzione)
        if: inputs.which == 'control'
        run: |
          echo "MARKER-CONTROL-READ-v2"
          MASK='s#(postgres(ql)?://)[^[:space:]"'"'"']*#\1<redacted>#g'
          if [ -z "$THE_ODDS_API_KEY" ]; then
            echo "::error::Chiave The Odds API assente fra i secrets."
            exit 1
          fi
          args=()
          if [ -n "$INPUT_SPORT_KEY" ]; then args+=(--sport-key "$INPUT_SPORT_KEY"); fi
          set +e
          npm run odds:control -- --ore "$INPUT_HOURS" "${args[@]}" 2>&1 | tee /tmp/control.log | sed -E "$MASK"
          code=$?
          set -e
          # I log grezzi non sono scaricabili da fuori: l'esito viene fissato
          # nel Summary del run e nelle annotazioni, così è leggibile dalla UI
          # senza aprire il log del passo.
          {
            echo "## Lettura di controllo — esito"
            echo '```'
            grep -E "MARKER|origine|lega:|chiave sport|id evento|percorso:|ESITO|book sharp|prezzo|verdetto|book osservati|letti alle|  mese|  oggi|Crediti spesi|NESSUNA|RIPIEGO|ATTENZIONE" /tmp/control.log | sed -E "$MASK" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            echo "::notice::$(echo "$line" | sed -E "$MASK")"
          done < <(grep -E "ESITO|Crediti spesi|origine" /tmp/control.log | head -4)
          exit "$code"

  migration-rehearsal:
    if: inputs.which == 'migration-rehearsal'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Codice
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dipendenze senza script e senza secret
        run: npm ci --ignore-scripts
      - name: Prova su copia Neon con rollback obbligatorio
        env:
          MIGRATION_TEST_DATABASE_URL: ${{ secrets.MIGRATION_TEST_DATABASE_URL }}
          PRODUCTION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/rehearse-quote-migration.mjs

  migration-apply-production:
    if: inputs.which == 'migration-apply-production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Codice
        uses: actions/checkout@v4
      - name: Conferma migrazione e snapshot senza connessioni
        env:
          MIGRATION_CONFIRMATION: ${{ inputs.migration_confirmation }}
          MIGRATION_SNAPSHOT: ${{ inputs.migration_snapshot }}
        run: |
          node --input-type=module -e "import {checkProductionConfirmation} from './scripts/apply-quote-migration-core.mjs'; checkProductionConfirmation(process.env.MIGRATION_CONFIRMATION, process.env.MIGRATION_SNAPSHOT)"
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dipendenze senza script e senza secret
        run: npm ci --ignore-scripts
      - name: Applica soltanto 0010 alla produzione
        env:
          MIGRATION_CONFIRMATION: ${{ inputs.migration_confirmation }}
          MIGRATION_SNAPSHOT: ${{ inputs.migration_snapshot }}
          MIGRATION_TEST_DATABASE_URL: ${{ secrets.MIGRATION_TEST_DATABASE_URL }}
          PRODUCTION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/apply-quote-migration-production.mjs
